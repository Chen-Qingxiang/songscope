name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: songscope
          POSTGRES_USER: songscope
          POSTGRES_PASSWORD: songscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songscope -d songscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://songscope:songscope@localhost:5432/songscope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
